// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlinVersion = '2.1.10'
    // Error Prone 2.43+ requires JDK 21; the project builds with JDK 17.
    ext.errorproneVersion = '2.42.0'
    ext.checkstyleVersion = '10.12.2'
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } // for lib extractor
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'de.mannodermaus.gradle.plugins:android-junit5:2.0.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" } // for lib extractor
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
